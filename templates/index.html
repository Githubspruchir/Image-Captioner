<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Caption Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    function showSpinner() {
      document.getElementById('spinner').classList.remove('hidden');
    }
  </script>
</head>
<body class="bg-gray-100 font-sans">
  <div class="min-h-screen flex flex-col items-center justify-center px-4">
    <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-lg">
      <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">🖼️ Image Caption Generator</h1>

      <form method="POST" enctype="multipart/form-data" class="space-y-4" onsubmit="showSpinner()">
        <input type="file" name="image" accept="image/*" required class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700">Generate Caption</button>
      </form>

      <!-- Spinner -->
      <div id="spinner" class="hidden mt-6 text-center">
        <svg class="animate-spin h-8 w-8 text-blue-600 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
        </svg>
        <p class="text-blue-600 mt-2">Generating caption...</p>
      </div>

      {% if filename %}
        <div class="mt-6 text-center">
          <h3 class="text-lg font-semibold text-gray-700 mb-2">Preview:</h3>
          <img src="{{ url_for('static', filename=filename) }}" alt="Uploaded Image" class="mx-auto rounded-xl shadow-lg w-full max-w-xs">
          <h3 class="mt-4 text-lg font-semibold text-gray-700">Caption:</h3>
          <p class="text-gray-800 text-md italic">{{ caption }}</p>
        </div>
      {% endif %}
    </div>
  </div>
</body>
</html>
